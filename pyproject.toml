[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-framework"
version = "0.1.0"
description = "Minimal, dependency-light Python framework for building LLM agents — control loop, tools, memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
keywords = [
  "ai",
  "agent",
  "llm",
  "agent-framework",
  "autonomous-agents",
  "tools",
  "openai",
  "react-agent",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["ruff>=0.6", "mypy>=1.10", "pytest>=8.0"]

[project.urls]
Homepage = "https://viprasol.com"
Repository = "https://github.com/Viprasol-Tech/ai-agent-framework"
Issues = "https://github.com/Viprasol-Tech/ai-agent-framework/issues"

[project.scripts]
agent-framework = "ai_agent_framework.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent_framework"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ai_agent_framework"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unused_configs = true
show_error_codes = true

# 'openai' is an optional extra, imported lazily; its stubs are not required to
# type-check or run the framework.
[[tool.mypy.overrides]]
module = ["openai"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
